name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy backend/ --ignore-missing-imports --no-strict-optional

      - name: Test
        # The full suite mocks the LLM (FakeLLM) and never calls the live
        # Mistral API, so no API key is required in CI.
        run: pytest -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Cloudflare Pages static export
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8501
        run: npm run pages:build

      - name: Audit high-severity vulnerabilities
        run: npm audit --audit-level=high
