[mypy]
ignore_missing_imports = True
no_strict_optional = True

# fpdf2's type stubs mark the still-functional `ln=` cell parameter as
# Literal['DEPRECATED'], producing arg-type errors on working code. The calls
# behave correctly at runtime; we defer the new_x/new_y migration rather than
# churn a working report module. Scoped narrowly to this one file.
[mypy-backend.reports.report_generator]
disable_error_code = arg-type
